<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 436" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">The six layers of an AI system, what changes each one and how to measure it, half-lives not yet measured</title>
  <desc id="layers-desc">A table of six layers, one row each: model; instructions and prompts; tool and API interface; data and memory; evaluation assets; human process. The second column names the typical change driver for each layer, the third says how to measure the layer's lifetime from a system's own history. The half-life column is blank in every row because no layer has been measured yet. The row order is not a ranking.</desc>
  <style>
    /* Colours come from the page palette (src/styles/diagrams.css); the fallbacks are the light theme. */
    .ha-bg { fill: var(--ha-surface, #ffffff); }
    .ha-row { fill: var(--ha-fill, #eef0f3); stroke: var(--ha-line, #5c6270); stroke-width: 1; }
    .ha-blank { fill: none; stroke: var(--ha-line, #5c6270); stroke-width: 1; stroke-dasharray: 4 4; }
    .ha-head { fill: var(--ha-ink, #1b1d22); font: 600 15px system-ui, sans-serif; }
    .ha-name { fill: var(--ha-ink, #1b1d22); font: 600 15px system-ui, sans-serif; }
    .ha-text { fill: var(--ha-ink, #1b1d22); font: 14px system-ui, sans-serif; }
    .ha-note { fill: var(--ha-line, #5c6270); font: italic 13px system-ui, sans-serif; }
  </style>
  <rect class="ha-bg" width="980" height="436"/>
  <text class="ha-head" x="24" y="34">Layer</text>
  <text class="ha-head" x="232" y="34">Typical change driver</text>
  <text class="ha-head" x="520" y="34">How to measure</text>
  <text class="ha-head" x="812" y="34">Half-life</text>

  <rect class="ha-row" x="16" y="48" width="768" height="52" rx="6"/>
  <text class="ha-name" x="32" y="79">Model</text>
  <text class="ha-text" x="232" y="79">Vendor releases and retirements</text>
  <text class="ha-text" x="520" y="79">Model ID changes in config history</text>
  <rect class="ha-blank" x="796" y="48" width="168" height="52" rx="6"/>

  <rect class="ha-row" x="16" y="108" width="768" height="52" rx="6"/>
  <text class="ha-name" x="32" y="139">Instructions and prompts</text>
  <text class="ha-text" x="232" y="139">Model swaps, product changes</text>
  <text class="ha-text" x="520" y="139">Rewrites in the prompt file history</text>
  <rect class="ha-blank" x="796" y="108" width="168" height="52" rx="6"/>

  <rect class="ha-row" x="16" y="168" width="768" height="52" rx="6"/>
  <text class="ha-name" x="32" y="199">Tool and API interface</text>
  <text class="ha-text" x="232" y="199">SDK and API version changes</text>
  <text class="ha-text" x="520" y="199">Schema and SDK version bumps</text>
  <rect class="ha-blank" x="796" y="168" width="168" height="52" rx="6"/>

  <rect class="ha-row" x="16" y="228" width="768" height="52" rx="6"/>
  <text class="ha-name" x="32" y="259">Data and memory</text>
  <text class="ha-text" x="232" y="259">New sources, new embedding model</text>
  <text class="ha-text" x="520" y="259">Re-index and migration events</text>
  <rect class="ha-blank" x="796" y="228" width="168" height="52" rx="6"/>

  <rect class="ha-row" x="16" y="288" width="768" height="52" rx="6"/>
  <text class="ha-name" x="32" y="319">Evaluation assets</text>
  <text class="ha-text" x="232" y="319">New failure modes, saturated tests</text>
  <text class="ha-text" x="520" y="319">Test-set version replacements</text>
  <rect class="ha-blank" x="796" y="288" width="168" height="52" rx="6"/>

  <rect class="ha-row" x="16" y="348" width="768" height="52" rx="6"/>
  <text class="ha-name" x="32" y="379">Human process</text>
  <text class="ha-text" x="232" y="379">Team, policy and regulation changes</text>
  <text class="ha-text" x="520" y="379">Revisions of runbooks and approvals</text>
  <rect class="ha-blank" x="796" y="348" width="168" height="52" rx="6"/>

  <text class="ha-note" x="16" y="424">Half-lives are blank until measured. Row order is not a ranking.</text>
</svg>
